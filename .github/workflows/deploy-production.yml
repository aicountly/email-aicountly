# ---------------------------------------------------------------------------
# Verify and deploy Aicountly Email  (production)
#
# ONE BUILD, TWO DESTINATIONS.
#
#   https://email.aicountly.com   business experience
#   https://aicountly.io          personal experience
#
# The same artifact is deployed to both. It has to be the same one: the
# hostname selects the presentation at runtime (web/src/config/frontend.ts), so
# a second build for the second domain would be a second thing to keep in step
# for no benefit, and the two could silently diverge.
#
# The BACKEND is deployed ONCE, with the business destination, and the database
# migrations run ONCE with it. Running them per frontend would run them twice
# against one database, which is how a migration matrix corrupts a schema.
#
# MANUAL ONLY. workflow_dispatch is the SINGLE trigger. Nothing in this file
# runs on a push, a pull request, a merge or a schedule, and nothing should be
# added that does — this repository's deploys are started by a person, on
# purpose, and the verification job below is part of that same run.
#
# The same checks run locally, and should be run there before merging:
#
#   cd web && npm run typecheck && npm run test:ci && npm run build
#   find server-php -name '*.php' -print0 | xargs -0 -n1 php -l
#   php server-php/tests/run.php
#   python3 scripts/audit-data-ownership.py
# ---------------------------------------------------------------------------
name: Deploy to cPanel Production

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Which destinations to deploy
        type: choice
        default: both
        options:
          - both
          - business
          - personal

# Never let two deploys to the same target overlap. Not cancel-in-progress: a
# half-finished upload that is cancelled leaves a release directory incomplete.
concurrency:
  group: email-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Build once. Everything downstream consumes this artifact — nothing rebuilds.
  # -------------------------------------------------------------------------
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Each of these is required. None of them is --if-present: a check that
      # silently does nothing when a script is renamed is worse than no check,
      # because the job still goes green.
      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test:ci

      - name: Lint the PHP API
        run: |
          find server-php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files parse."

      - name: Audit for cross-application database replication
        run: python3 scripts/audit-data-ownership.py

      - name: Build one artifact for both destinations
        working-directory: web
        env:
          # PROD_API_BASE_URL (Settings > Secrets and variables > Actions >
          # Variables) is an OPTIONAL override that points BOTH destinations at
          # one backend. Left unset, each host resolves its own API at runtime:
          # the business host is same-origin with /api, and the personal host
          # calls the common Email backend. See web/src/config/frontend.ts.
          VITE_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          VITE_APP_NAME: Email
          VITE_APP_ENV: production
          VITE_GA4_SAAS_EMAIL_MEASUREMENT_ID: ${{ vars.PROD_GA4_MEASUREMENT_ID }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::notice::PROD_API_BASE_URL is unset — each destination resolves its own API at runtime."
          else
            echo "Building against a single API base URL: $VITE_API_BASE_URL"
          fi
          # Assets are addressed by commit so two releases can coexist in the
          # document root and an open browser session keeps working across a
          # deploy.
          npm run build -- --base="/releases/${RELEASE_ID}/"

      - name: Stamp the release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: python3 scripts/stamp-release.py web/dist

      - name: Verify build output
        run: |
          test -f web/dist/index.html || { echo "::error::web/dist/index.html missing — the build produced no output"; exit 1; }
          test -f web/dist/.htaccess  || { echo "::error::web/dist/.htaccess missing — SPA routes would 404 on refresh, which breaks /auth/callback"; exit 1; }
          grep -q 'aicountly-release' web/dist/index.html || { echo "::error::the release marker was not stamped"; exit 1; }

          # A .env in the bundle is a published .env.
          if find web/dist -name '.env*' | grep -q .; then
            echo "::error::an .env file ended up in web/dist — refusing to deploy"
            exit 1
          fi
          # A source map would publish the whole source tree; vite.config.ts has
          # sourcemap off, and this is the check that it stayed off.
          if find web/dist -name '*.map' | grep -q .; then
            echo "::error::source maps are present in web/dist — refusing to publish them"
            exit 1
          fi

          test -d server-php || { echo "::error::server-php/ is missing"; exit 1; }
          test -f server-php/index.php || { echo "::error::server-php/index.php missing — the API has no front controller"; exit 1; }
          if find server-php -name '.env' | grep -q .; then
            echo "::error::server-php contains a committed .env — refusing to deploy. The API .env belongs on the server only."
            exit 1
          fi

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: email-frontend-${{ github.sha }}
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # Deploy the SAME artifact to each destination, independently.
  #
  # fail-fast is off and each destination reports its own result: two hosts
  # cannot be updated as one transaction, and pretending otherwise would hide a
  # half-deployed release.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: business
            label: business (email.aicountly.com)
            environment: email-business
            origin: https://email.aicountly.com
            # The backend and its migrations belong to exactly one destination.
            deploy_backend: true
            # The business destination predates the personal one and is already
            # configured with repository-level PROD_SSH_* secrets. They stay
            # valid; environment secrets of the same name take precedence.
            allow_legacy_secrets: true
          - target: personal
            label: personal (aicountly.io)
            environment: email-personal
            origin: https://aicountly.io
            deploy_backend: false
            # No fallback here, deliberately: inheriting the business host's
            # credentials would deploy the personal build over the business site.
            allow_legacy_secrets: false

    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.origin }}

    steps:
      - name: Skip destinations that were not requested
        id: requested
        env:
          REQUESTED: ${{ inputs.targets }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$REQUESTED" = "both" ] || [ "$REQUESTED" = "$TARGET" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TARGET was not selected for this run."
          fi

      - name: Check out repository
        if: steps.requested.outputs.run == 'true'
        uses: actions/checkout@v4

      # Resolve the credentials for THIS destination, and decide between three
      # outcomes: deploy, skip because nothing is configured yet, or fail
      # because it is half-configured. The third is the dangerous one — a
      # partially set environment is how a deploy lands somewhere unintended.
      - name: Resolve deployment configuration
        if: steps.requested.outputs.run == 'true'
        id: config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_REMOTE_ROOT: ${{ secrets.SSH_REMOTE_ROOT }}
          LEGACY_HOST: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_HOST || '' }}
          LEGACY_PORT: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_PORT || '' }}
          LEGACY_USER: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_USER || '' }}
          LEGACY_KEY: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_PRIVATE_KEY || '' }}
          LEGACY_ROOT: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_REMOTE_ROOT || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          host="${SSH_HOST:-$LEGACY_HOST}"
          port="${SSH_PORT:-$LEGACY_PORT}"
          user="${SSH_USER:-$LEGACY_USER}"
          key="${SSH_PRIVATE_KEY:-$LEGACY_KEY}"
          root="${SSH_REMOTE_ROOT:-$LEGACY_ROOT}"

          set_count=0
          for value in "$host" "$user" "$key" "$root"; do
            [ -n "$value" ] && set_count=$((set_count + 1))
          done

          if [ "$set_count" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The $TARGET destination is not configured yet — nothing was deployed to it."
            {
              echo "### $TARGET — SKIPPED"
              echo ""
              echo "No deployment credentials are set for the \`${{ matrix.environment }}\` environment."
              echo "Set \`SSH_HOST\`, \`SSH_USER\`, \`SSH_PRIVATE_KEY\` and \`SSH_REMOTE_ROOT\` on it to enable this destination."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$set_count" -lt 4 ]; then
            echo "::error::The $TARGET destination is only partly configured ($set_count of 4 required secrets). Refusing to deploy with a guess."
            exit 1
          fi

          # --delete is used below against the document root, so a root that
          # resolves to the home directory would take the whole account with it.
          case "$root" in
            ''|.|./|'~'|'~/')
              echo "::error::SSH_REMOTE_ROOT for $TARGET points at the home directory itself. Use the document root, e.g. public_html"
              exit 1 ;;
            /|/home|/home/|/root|/var|/etc|/usr|/bin|/sbin|/boot|/opt)
              echo "::error::SSH_REMOTE_ROOT for $TARGET is a system directory and is unsafe for a deploy"
              exit 1 ;;
            ..|../*|*/../*|*/..)
              echo "::error::SSH_REMOTE_ROOT for $TARGET must not contain a parent-directory reference"
              exit 1 ;;
          esac

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "remote_root=$root" >> "$GITHUB_OUTPUT"
          echo "Deploy target for $TARGET validated."

      - name: Download the artifact built for this commit
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: email-frontend-${{ github.sha }}
          path: dist

      - name: Confirm the artifact is the one that was built
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          test -f dist/index.html || { echo "::error::the downloaded artifact has no index.html"; exit 1; }
          grep -q "content=\"$RELEASE_ID\"" dist/index.html || {
            echo "::error::the artifact is not stamped with $RELEASE_ID — refusing to deploy an unidentified build"
            exit 1
          }
          echo "Artifact verified as release $RELEASE_ID."

      - name: Configure SSH
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          LEGACY_HOST: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_HOST || '' }}
          LEGACY_PORT: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_PORT || '' }}
          LEGACY_USER: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_USER || '' }}
          LEGACY_KEY: ${{ matrix.allow_legacy_secrets && secrets.PROD_SSH_PRIVATE_KEY || '' }}
        run: |
          host="${SSH_HOST:-$LEGACY_HOST}"
          port="${SSH_PORT:-${LEGACY_PORT:-22}}"
          user="${SSH_USER:-$LEGACY_USER}"
          key="${SSH_PRIVATE_KEY:-$LEGACY_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A truncated paste or CRLF line endings produce a key file that ssh
          # silently ignores, which then surfaces only as "Permission denied
          # (publickey)". Catch it here where the cause is still obvious.
          sed -i 's/\r$//' ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::The private key for this destination is not a usable OpenSSH key. Copy the whole file, including the BEGIN and END lines."
            exit 1
          fi

          # Fingerprint and public key are not secret, and they are what you
          # compare against the server to confirm the right key is authorised.
          echo "Deploy key: $(ssh-keygen -l -f ~/.ssh/deploy_key)"
          echo "Public key that must appear in the cPanel user's ~/.ssh/authorized_keys:"
          sed 's/^/    /' ~/.ssh/deploy_key.pub

          # Pin the host key so a deploy fails closed rather than trusting
          # whatever answers on that address.
          if ! ssh-keyscan -p "$port" -H "$host" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan could not reach the host on the configured port."
            sed 's/^/    /' /tmp/keyscan.err
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::The host returned no SSH host key. Check SSH_HOST and SSH_PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          # Older cPanel / CloudLinux hosts offer only RSA with SHA-1, which
          # OpenSSH 8.8+ (what the runner ships) refuses by default. Without
          # these two options such a server rejects a perfectly valid key with
          # exactly the same "Permission denied (publickey)" message.
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $host
            User $user
            Port $port
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Verify SSH authentication
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        run: |
          if ssh deploy-target 'echo connected' > /tmp/ssh.out 2>/tmp/ssh.err; then
            echo "SSH authentication succeeded."
            exit 0
          fi

          echo "::error::SSH authentication failed for this destination. The server refused the deploy key."
          sed 's/^/    /' /tmp/ssh.err

          cat <<'HINT'

          Most common causes, in the order worth checking:

            1. The public key is imported but NOT AUTHORISED. cPanel treats
               those as two separate actions: SSH Access > Manage SSH Keys >
               Manage > Authorize.
            2. The server is too old for the key type. OpenSSH below 6.5 ignores
               an Ed25519 key entirely; generate RSA (ssh-keygen -t rsa -b 4096).
            3. The public key printed above does not match the one in the
               account's ~/.ssh/authorized_keys.
            4. SSH_USER is not the cPanel account username.
            5. Permissions on the server: ~/.ssh must be 700 and
               ~/.ssh/authorized_keys 600, owned by the account.

          HINT
          exit 1

      # ---------------------------------------------------------------------
      # Upload the release. NOTHING IS ACTIVATED YET.
      #
      # No --delete here, and that is the point: a previous release's assets
      # stay on disk so a browser that loaded the old index.html keeps working
      # while this one goes live, and so a rollback has something to roll back
      # to.
      # ---------------------------------------------------------------------
      - name: Upload the release
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        env:
          REMOTE_ROOT: ${{ steps.config.outputs.remote_root }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh deploy-target "mkdir -p '$REMOTE_ROOT/releases/$RELEASE_ID'"

          # .htaccess is excluded from the release directory on purpose: inside
          # releases/ it would apply its SPA fallback there, and a missing asset
          # would be answered with the application instead of a 404.
          rsync -az --human-readable \
            --exclude='.htaccess' \
            --exclude='.env' --exclude='.env.*' --exclude='.git*' \
            --chmod=D755,F644 \
            -e ssh \
            dist/ "deploy-target:$REMOTE_ROOT/releases/$RELEASE_ID/"

          # Every file that was sent is on the far side, at the right size.
          local_count=$(find dist -type f ! -name '.htaccess' | wc -l)
          remote_count=$(ssh deploy-target "find '$REMOTE_ROOT/releases/$RELEASE_ID' -type f | wc -l")
          echo "Uploaded $remote_count file(s); the build has $local_count."
          if [ "$remote_count" -lt "$local_count" ]; then
            echo "::error::the release directory is incomplete — refusing to activate it"
            exit 1
          fi

      # The document root's own .htaccess, which carries the SPA fallback and
      # the /releases/ exclusion. Sent before activation, because the new
      # index.html depends on those rules being in place.
      - name: Update the document root configuration
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        env:
          REMOTE_ROOT: ${{ steps.config.outputs.remote_root }}
        run: |
          rsync -az --chmod=F644 -e ssh dist/.htaccess "deploy-target:$REMOTE_ROOT/.htaccess"
          echo "Document root .htaccess updated."

      # ---------------------------------------------------------------------
      # Activate. One atomic rename, last, after everything else is in place.
      #
      # `mv` within one filesystem is atomic, so no request ever sees a partial
      # index.html — which a straight overwrite of a live file can produce.
      # ---------------------------------------------------------------------
      - name: Activate the release
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        env:
          REMOTE_ROOT: ${{ steps.config.outputs.remote_root }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh deploy-target "REMOTE_ROOT='$REMOTE_ROOT' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -eu

          release_dir="$REMOTE_ROOT/releases/$RELEASE_ID"
          live="$REMOTE_ROOT/index.html"
          staged="$REMOTE_ROOT/.index-$RELEASE_ID.pending"
          backup="$release_dir/previous-index.html"

          [ -f "$release_dir/index.html" ] || { echo "release index.html missing"; exit 1; }

          # Keep the index this release replaces, so a rollback restores exactly
          # what was live rather than a guess. Only the FIRST backup is kept:
          # re-running the same release must not overwrite it with its own output.
          if [ -f "$live" ] && [ ! -f "$backup" ]; then
            cp -p "$live" "$backup"
            echo "Previous index.html preserved at releases/$RELEASE_ID/previous-index.html"
          fi

          cp -p "$release_dir/index.html" "$staged"
          mv -f "$staged" "$live"

          echo "Activated release $RELEASE_ID"
          REMOTE

      # ---------------------------------------------------------------------
      # The backend. ONE destination only — see the header of this file.
      # ---------------------------------------------------------------------
      - name: Deploy the API
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true' && matrix.deploy_backend
        env:
          REMOTE_ROOT: ${{ steps.config.outputs.remote_root }}
        run: |
          # --delete keeps api/ free of files removed from the repository. The
          # API's .env is created once by hand on the server and read at runtime,
          # so both excludes are what keep the live configuration alive.
          #
          # .env.example IS shipped, and the include comes first because rsync
          # takes the first matching rule: it is the file somebody copies to
          # api/.env, and telling them to copy a template that was never
          # uploaded is an instruction nobody can follow. It holds placeholders
          # only, and the .htaccess beside it 404s every dotfile over HTTP.
          rsync -avz --delete \
            --include='.env.example' \
            --exclude='.env' --exclude='.env.*' --exclude='.git*' \
            --chmod=D755,F644 \
            -e ssh \
            server-php/ "deploy-target:$REMOTE_ROOT/api/"

          echo "::notice::If this is the first API deploy, copy api/.env.example to api/.env on the server and fill it in."

      # Applies pending migrations ON THE SERVER, against the database api/.env
      # points at, using the files the previous step just uploaded. It runs on
      # every backend deploy because it is a no-op when nothing is pending.
      #
      # It FAILS THE DEPLOY. New code against an old schema is an app that still
      # answers 200 on /health and 503 on everything real, which is the most
      # confusing possible outcome.
      - name: Run database migrations
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true' && matrix.deploy_backend
        env:
          REMOTE_ROOT: ${{ steps.config.outputs.remote_root }}
          PHP_BIN: ${{ secrets.PROD_PHP_BIN }}
        run: |
          rc=0
          ssh deploy-target "REMOTE_ROOT='$REMOTE_ROOT' PHP_BIN='${PHP_BIN:-}' bash -s" <<'REMOTE' || rc=$?
          set -u

          cd "$REMOTE_ROOT/api" 2>/dev/null || exit 91
          [ -f .env ] || exit 92

          # cPanel hosts carry several PHP builds and the one on PATH is often
          # the oldest. This app needs 8.1+ (readonly properties, enums) and
          # pdo_pgsql, so a candidate is accepted only if it has both.
          php_ok() {
            [ -x "$1" ] || return 1
            v=$("$1" -r 'echo PHP_VERSION_ID;' 2>/dev/null) || return 1
            case "$v" in ''|*[!0-9]*) return 1 ;; esac
            [ "$v" -ge 80100 ] || return 1
            "$1" -m 2>/dev/null | grep -qix 'pdo_pgsql' || return 1
          }

          PHP=""
          if [ -n "${PHP_BIN:-}" ] && php_ok "$PHP_BIN"; then
            PHP="$PHP_BIN"
          else
            for candidate in /opt/cpanel/ea-php84/root/usr/bin/php \
                             /opt/cpanel/ea-php83/root/usr/bin/php \
                             /opt/cpanel/ea-php82/root/usr/bin/php \
                             /opt/cpanel/ea-php81/root/usr/bin/php \
                             /usr/local/bin/php /usr/bin/php php; do
              if php_ok "$candidate"; then PHP="$candidate"; break; fi
            done
          fi

          [ -n "$PHP" ] || exit 93

          "$PHP" bin/migrate.php
          REMOTE

          case "$rc" in
            0)  echo "Migrations are up to date." ;;
            91) echo "::error::$REMOTE_ROOT/api does not exist on the server. Deploy the API first."; exit 1 ;;
            92) echo "::error::api/.env does not exist on the server. Copy api/.env.example to api/.env and fill it in."; exit 1 ;;
            93) echo "::error::No PHP 8.1+ with pdo_pgsql was found on the server. Set the PROD_PHP_BIN secret to its full path."; exit 1 ;;
            2)  echo "::error::A migration that has already been applied has been edited. Add a new migration instead."; exit 1 ;;
            *)  echo "::error::Migrations failed (exit $rc)."; exit 1 ;;
          esac

      - name: Smoke-test the deployed API
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true' && matrix.deploy_backend
        env:
          ORIGIN: ${{ matrix.origin }}
        run: |
          code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$ORIGIN/api/health" || echo "000")
          if [ "$code" = "200" ]; then
            echo "GET $ORIGIN/api/health -> 200"
            cat /tmp/health.json
            # 'usable' is false when the database or the mail store is not ready.
            # That is a warning rather than a failure: the frontend renders an
            # honest unavailable state for it, and it is often the expected
            # answer on a first deploy.
            if ! grep -q '"usable":true' /tmp/health.json; then
              echo "::warning::The API is up but reports usable:false. Check the database and mail configuration in api/.env."
            fi
          else
            echo "::warning::GET $ORIGIN/api/health returned $code. On a first deploy, check the subdomain's document root and that api/.env exists."
          fi

      - name: Verify the live release
        if: steps.requested.outputs.run == 'true' && steps.config.outputs.configured == 'true'
        env:
          SITE_ORIGIN: ${{ matrix.origin }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: python3 scripts/verify-release.py

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub ~/.ssh/config

      - name: Summary
        if: always() && steps.requested.outputs.run == 'true'
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Destination | ${{ matrix.origin }} |"
            echo "| Release | \`${RELEASE_ID}\` |"
            echo "| Assets | \`releases/${RELEASE_ID}/\` |"
            echo "| Backend | ${{ matrix.deploy_backend && 'deployed with this destination' || 'not deployed here — the backend is deployed once, with the business destination' }} |"
            echo "| Configured | ${{ steps.config.outputs.configured }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Two hosts are not one transaction. This reports what actually happened to
  # each of them rather than letting one green tick imply both.
  # -------------------------------------------------------------------------
  report:
    name: Report
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Independent results
        run: |
          {
            echo "### Deployment result"
            echo ""
            echo "Each destination is deployed and verified on its own. A partial"
            echo "deployment is a real outcome, not an error in the reporting:"
            echo "check the job for each destination above."
            echo ""
            echo "Overall deploy status: \`${{ needs.deploy.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "::warning::At least one destination did not deploy successfully. The others may have."
          fi
