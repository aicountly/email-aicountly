# ---------------------------------------------------------------------------
# Deploy Aicountly Email to cPanel Sandbox  (https://email.gh.aicountly.com)
#
# MANUAL ONLY. workflow_dispatch is the single trigger — merging or pushing
# never deploys. Add no push/schedule triggers to this file.
#
# The sandbox serves the BUSINESS presentation, because email.gh.aicountly.com
# is in the reviewed host table as business (web/src/config/frontend.ts). It is
# one destination, so there is no matrix here; production has two and deploys
# the same artifact to both.
#
# Same release scheme as production: assets go into releases/<sha>/, the root
# index.html is activated last with one atomic rename, and no previous release
# is deleted.
# ---------------------------------------------------------------------------
name: Deploy to cPanel Sandbox

on:
  workflow_dispatch:

concurrency:
  group: email-sandbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fail before doing any work if the deploy target is not fully
      # configured. An unset secret would otherwise expand to an empty string
      # and rsync would target something nobody intended.
      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SANDBOX_SSH_HOST }}
          SSH_USER: ${{ secrets.SANDBOX_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SANDBOX_SSH_PRIVATE_KEY }}
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ]        || missing="$missing SANDBOX_SSH_HOST"
          [ -n "$SSH_USER" ]        || missing="$missing SANDBOX_SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SANDBOX_SSH_PRIVATE_KEY"
          [ -n "$REMOTE_ROOT" ]     || missing="$missing SANDBOX_SSH_REMOTE_ROOT"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty required secret(s):$missing"
            exit 1
          fi

          # A relative remote root is normal on cPanel: rsync resolves it
          # against the SSH user's home directory. What must be refused is
          # anything that resolves to the home directory itself or climbs out
          # of it, because the API step below runs with --delete.
          case "$REMOTE_ROOT" in
            ''|.|./|'~'|'~/')
              echo "::error::SANDBOX_SSH_REMOTE_ROOT points at the home directory itself. Use the document root, e.g. public_html"
              exit 1 ;;
            /|/home|/home/|/root|/var|/etc|/usr|/bin|/sbin|/boot|/opt)
              echo "::error::SANDBOX_SSH_REMOTE_ROOT is a system directory and is unsafe for a deploy"
              exit 1 ;;
            ..|../*|*/../*|*/..)
              echo "::error::SANDBOX_SSH_REMOTE_ROOT must not contain a parent-directory reference"
              exit 1 ;;
          esac
          echo "Deploy target validated."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test:ci

      - name: Lint the PHP API
        run: find server-php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Audit for cross-application database replication
        run: python3 scripts/audit-data-ownership.py

      - name: Build
        working-directory: web
        env:
          # SANDBOX_API_BASE_URL is an OPTIONAL override. Left unset, the app
          # calls its own origin + /api, which is where this workflow puts the
          # API below.
          VITE_API_BASE_URL: ${{ vars.SANDBOX_API_BASE_URL }}
          VITE_APP_NAME: Email
          VITE_APP_ENV: sandbox
          VITE_GA4_SAAS_EMAIL_MEASUREMENT_ID: ''
          RELEASE_ID: ${{ github.sha }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::notice::SANDBOX_API_BASE_URL is unset — the app will call https://email.gh.aicountly.com/api (same origin)."
          fi
          npm run build -- --base="/releases/${RELEASE_ID}/"

      - name: Stamp the release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: python3 scripts/stamp-release.py web/dist

      - name: Verify build output
        run: |
          test -f web/dist/index.html || { echo "::error::web/dist/index.html missing"; exit 1; }
          test -f web/dist/.htaccess  || { echo "::error::web/dist/.htaccess missing — SPA routes would 404 on refresh"; exit 1; }
          grep -q 'aicountly-release' web/dist/index.html || { echo "::error::the release marker was not stamped"; exit 1; }
          if find web/dist -name '.env*' -o -name '*.map' | grep -q .; then
            echo "::error::an .env or a source map ended up in web/dist — refusing to deploy"
            exit 1
          fi
          test -f server-php/index.php || { echo "::error::server-php/index.php missing"; exit 1; }
          if find server-php -name '.env' | grep -q .; then
            echo "::error::server-php contains a committed .env — refusing to deploy"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SANDBOX_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SANDBOX_SSH_HOST }}
          SSH_PORT: ${{ secrets.SANDBOX_SSH_PORT }}
          SSH_USER: ${{ secrets.SANDBOX_SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          # CRLF line endings produce a key ssh silently ignores, which surfaces
          # only as "Permission denied (publickey)".
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::SANDBOX_SSH_PRIVATE_KEY is not a usable OpenSSH private key. Copy the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "Public key that must be AUTHORISED in cPanel for this account:"
          sed 's/^/    /' ~/.ssh/deploy_key.pub

          # Pin the host key so the deploy fails closed rather than trusting
          # whatever answers on that address.
          if ! ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan could not reach the host on the configured port."
            sed 's/^/    /' /tmp/keyscan.err
            exit 1
          fi
          [ -s ~/.ssh/known_hosts ] || { echo "::error::The host returned no SSH host key. Check SANDBOX_SSH_HOST and SANDBOX_SSH_PORT."; exit 1; }
          chmod 600 ~/.ssh/known_hosts

          # Older cPanel / CloudLinux hosts offer only RSA with SHA-1, which
          # OpenSSH 8.8+ refuses by default and reports as the same
          # "Permission denied" as an unauthorised key.
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Verify SSH authentication
        run: |
          if ssh deploy-target 'echo connected' >/dev/null 2>/tmp/ssh.err; then
            echo "SSH authentication succeeded."
            exit 0
          fi
          echo "::error::SSH authentication failed. Most often the key is imported but not AUTHORISED in cPanel (SSH Access > Manage SSH Keys > Manage > Authorize)."
          sed 's/^/    /' /tmp/ssh.err
          exit 1

      # No --delete: the previous release's assets stay so an open browser
      # session keeps working across the deploy, and so a rollback has
      # something to restore.
      - name: Upload the release
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh deploy-target "mkdir -p '$REMOTE_ROOT/releases/$RELEASE_ID'"

          # .htaccess is excluded here and sent to the document root separately:
          # inside releases/ its SPA fallback would answer a missing asset with
          # the application instead of a 404.
          rsync -az --exclude='.htaccess' --exclude='.env' --exclude='.env.*' --exclude='.git*' \
            --chmod=D755,F644 -e ssh \
            web/dist/ "deploy-target:$REMOTE_ROOT/releases/$RELEASE_ID/"

          local_count=$(find web/dist -type f ! -name '.htaccess' | wc -l)
          remote_count=$(ssh deploy-target "find '$REMOTE_ROOT/releases/$RELEASE_ID' -type f | wc -l")
          echo "Uploaded $remote_count file(s); the build has $local_count."
          [ "$remote_count" -ge "$local_count" ] || { echo "::error::the release directory is incomplete — refusing to activate it"; exit 1; }

      - name: Update the document root configuration
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: rsync -az --chmod=F644 -e ssh web/dist/.htaccess "deploy-target:$REMOTE_ROOT/.htaccess"

      # One atomic rename, last. No request ever sees a partial index.html.
      - name: Activate the release
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh deploy-target "REMOTE_ROOT='$REMOTE_ROOT' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -eu
          release_dir="$REMOTE_ROOT/releases/$RELEASE_ID"
          live="$REMOTE_ROOT/index.html"
          staged="$REMOTE_ROOT/.index-$RELEASE_ID.pending"
          backup="$release_dir/previous-index.html"

          [ -f "$release_dir/index.html" ] || { echo "release index.html missing"; exit 1; }

          # Only the FIRST backup is kept, so re-running a release does not
          # overwrite the index it originally replaced.
          if [ -f "$live" ] && [ ! -f "$backup" ]; then
            cp -p "$live" "$backup"
          fi

          cp -p "$release_dir/index.html" "$staged"
          mv -f "$staged" "$live"
          echo "Activated release $RELEASE_ID"
          REMOTE

      - name: Deploy the API
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
        run: |
          # The API's .env is created once by hand on the server and read at
          # runtime, so it must survive --delete. .env.example IS shipped and
          # the include comes first because rsync takes the first matching rule.
          rsync -avz --delete \
            --include='.env.example' \
            --exclude='.env' --exclude='.env.*' --exclude='.git*' \
            --chmod=D755,F644 -e ssh \
            server-php/ "deploy-target:$REMOTE_ROOT/api/"
          echo "::notice::On a first API deploy, copy api/.env.example to api/.env on the server and fill it in."

      - name: Run database migrations
        env:
          REMOTE_ROOT: ${{ secrets.SANDBOX_SSH_REMOTE_ROOT }}
          PHP_BIN: ${{ secrets.SANDBOX_PHP_BIN }}
        run: |
          rc=0
          ssh deploy-target "REMOTE_ROOT='$REMOTE_ROOT' PHP_BIN='${PHP_BIN:-}' bash -s" <<'REMOTE' || rc=$?
          set -u
          cd "$REMOTE_ROOT/api" 2>/dev/null || exit 91
          [ -f .env ] || exit 92

          # cPanel hosts carry several PHP builds and the one on PATH is often
          # the oldest. 8.1+ and pdo_pgsql are both required.
          php_ok() {
            [ -x "$1" ] || return 1
            v=$("$1" -r 'echo PHP_VERSION_ID;' 2>/dev/null) || return 1
            case "$v" in ''|*[!0-9]*) return 1 ;; esac
            [ "$v" -ge 80100 ] || return 1
            "$1" -m 2>/dev/null | grep -qix 'pdo_pgsql' || return 1
          }

          PHP=""
          if [ -n "${PHP_BIN:-}" ] && php_ok "$PHP_BIN"; then
            PHP="$PHP_BIN"
          else
            for candidate in /opt/cpanel/ea-php84/root/usr/bin/php \
                             /opt/cpanel/ea-php83/root/usr/bin/php \
                             /opt/cpanel/ea-php82/root/usr/bin/php \
                             /opt/cpanel/ea-php81/root/usr/bin/php \
                             /usr/local/bin/php /usr/bin/php php; do
              if php_ok "$candidate"; then PHP="$candidate"; break; fi
            done
          fi
          [ -n "$PHP" ] || exit 93

          "$PHP" bin/migrate.php
          REMOTE

          case "$rc" in
            0)  echo "Migrations are up to date." ;;
            91) echo "::error::$REMOTE_ROOT/api does not exist. Deploy the API first."; exit 1 ;;
            92) echo "::error::api/.env does not exist on the server."; exit 1 ;;
            93) echo "::error::No PHP 8.1+ with pdo_pgsql found. Set SANDBOX_PHP_BIN to its full path."; exit 1 ;;
            2)  echo "::error::An applied migration has been edited. Add a new migration instead."; exit 1 ;;
            *)  echo "::error::Migrations failed (exit $rc)."; exit 1 ;;
          esac

      - name: Smoke-test the deployed API
        run: |
          code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' --max-time 20 "https://email.gh.aicountly.com/api/health" || echo "000")
          if [ "$code" = "200" ]; then
            cat /tmp/health.json
            grep -q '"usable":true' /tmp/health.json || echo "::warning::The API is up but reports usable:false — check the database and mail settings in api/.env."
          else
            echo "::warning::GET /api/health returned $code."
          fi

      - name: Verify the live release
        env:
          SITE_ORIGIN: https://email.gh.aicountly.com
          EXPECTED_RELEASE: ${{ github.sha }}
        run: python3 scripts/verify-release.py

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub ~/.ssh/config

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sandbox deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Destination | https://email.gh.aicountly.com |"
            echo "| Presentation | business |"
            echo "| Release | \`${GITHUB_SHA}\` |"
            echo "| Assets | \`releases/${GITHUB_SHA}/\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
