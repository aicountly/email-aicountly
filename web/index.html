<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- Business and personal are the same bundle. The description stays
         neutral because one build serves both destinations. -->
    <meta name="description" content="Aicountly Email — every conversation moves business forward." />
    <meta name="theme-color" content="#087b63" />
    <!-- A mailbox has no business being indexed or previewed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Aicountly Email</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Aicountly Email needs JavaScript. Enable it, or open your mailbox in a client that supports it.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
